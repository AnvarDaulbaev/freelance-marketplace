name: freelance-marketplace

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm
      POSTGRES_PASSWORD: fm
      POSTGRES_DB: freelance_marketplace
    ports:
      # Local machine only: never expose the database to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm -d freelance_marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fm:fm@db:5432/freelance_marketplace
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:3100,http://127.0.0.1:3100
      # Browser traffic arrives via nginx, which overwrites X-Forwarded-For
      # with the real client IP. Requests without the header come from the
      # web container's server-side rendering (internal network only).
      TRUST_PROXY: "true"
      # Set to "true" once the site is served over HTTPS.
      COOKIE_SECURE: "false"
    # No published port: the API is reachable only through nginx.
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on:
      - api

  # The only service exposed to the outside.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 3000 is taken by another local project
      - "3100:80"
    depends_on:
      - web
      - api

volumes:
  db-data:
