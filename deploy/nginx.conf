# Single public entrypoint. Sets the real client IP for the API, limits
# request rates/connections per IP, and cuts off slow clients (slowloris).

server_tokens off;

# Per-client-IP budgets. Requests over the rate get 429 (after the burst).
# Kept generous on purpose: mobile carriers in KG/CIS put many subscribers
# behind one public IP (CGNAT). Fine-grained limits live in the API.
limit_req_zone  $binary_remote_addr zone=per_ip:10m      rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_per_ip:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

client_max_body_size   1m;
client_body_timeout    10s;
client_header_timeout  10s;
send_timeout           15s;
large_client_header_buffers 4 8k;

upstream web { server web:3000; keepalive 16; }
upstream api { server api:4000; keepalive 16; }

server {
    listen 80;
    keepalive_timeout 15s;

    limit_conn conn_per_ip 60;

    # Overwrite (never append to) X-Forwarded-For: whatever the client sent
    # is discarded, so the API always sees the real address.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://api;
    }

    location / {
        limit_req zone=per_ip burst=80 nodelay;
        proxy_pass http://web;
    }
}
